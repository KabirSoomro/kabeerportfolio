<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 2rem; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        .admin-card {
            background: var(--bg-glass);
            backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: var(--card-shadow);
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-weight: 600;}
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
        }
        [data-theme="light"] .form-group input, [data-theme="light"] .form-group select, [data-theme="light"] .form-group textarea {
            background: rgba(255,255,255,0.5);
        }
        #dashboard { display: none; }
        .logout-btn { float: right; background: var(--danger); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--accent-primary); }
        
        /* Reset cursor for admin panel */
        * { cursor: auto !important; }
        a, button, input[type="submit"] { cursor: pointer !important; }
    </style>
</head>
<body data-theme="dark">
    
    <div class="aurora-bg">
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="container admin-container">
        
        <!-- Back Link -->
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none; display: inline-block; margin-bottom: 2rem;">
            <i class="fas fa-arrow-left"></i> Back to Portfolio
        </a>

        <!-- Login Section -->
        <div id="loginSection" class="admin-card" style="display: none;">
            <h2 class="section-title" style="font-size: 2.5rem; margin-bottom: 2rem;">Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="admin@example.com">
                    <span id="emailError" style="color: var(--danger); font-size: 0.85rem; display: none; margin-top: 0.5rem;"></span>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                    <span id="passwordError" style="color: var(--danger); font-size: 0.85rem; display: none; margin-top: 0.5rem;"></span>
                </div>
                <button type="button" class="btn btn-primary" style="width: 100%" onclick="handleLogin()">Login</button>
            </form>
            <p id="loginError" style="color: var(--danger); margin-top: 1rem; text-align: center; display: none;"></p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard" style="display: block;">
            <a href="index.html" class="btn btn-primary logout-btn"><i class="fas fa-home"></i> Back to Home</a>
            <h2 class="section-title" style="font-size: 2.5rem; text-align: left; margin-bottom: 2rem;">Dashboard Disabled</h2>
            
            <div class="admin-card">
                <h3>Backend Removed</h3>
                <p style="margin-top: 1rem; color: var(--text-secondary);">The Supabase backend has been completely removed from this project as per your request.</p>
                <p style="margin-top: 1rem; color: var(--text-secondary);">To edit your skills, please open <strong>script.js</strong> and update the <code>skillsData</code> array manually.</p>
            </div>
        </div>

    </div>

</body>
</html>
